[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pkmodel-marks"
authors = [{name ="Matthew Peters"}, {name="Adam Michaels"},{name="Reefe Conley"},{name="Katie Barton"},{name="Saja Isabella Ilott"}]
version = "0.1.0"
description = "Group Python Project for Pharmacokinetics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

docs = [
    "sphinx>=1.5, !=1.7.3",
    "sphinx-rtd-theme",
    "myst-parser",
]

app = [
    "streamlit",
]
