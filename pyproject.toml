[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pkmodel-marks"
version = "0.1.0"
description = "Group Python Project for Pharmacokinetics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx",
    "myst-parser",
]

app = [
    "streamlit",
]

[tool.setuptools]
packages = [
    "pkmodel"
    ]